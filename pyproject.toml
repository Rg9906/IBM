[project]
name = "queueshield"
version = "0.1.0"
description = "Payment-gateway degradation detection, forecasting, localisation and operator-approved recovery, evaluated in a simulator."
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0", "scipy>=1.11", "pydantic>=2.5", "PyYAML>=6.0", "scikit-learn==1.8.0", "rrcf>=0.4",
  "fastapi>=0.111", "uvicorn>=0.30", "setuptools<81",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["qs*"]

[tool.setuptools.package-data]
"qs.ui" = ["static/*"]
"qs.store" = ["schema.sql"]
